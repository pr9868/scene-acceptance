[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scene-acceptance"
version = "0.4.0"
description = "Contract-based acceptance of bounded OpenUSD layouts and declared claims"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Pradeep Kaushik"}]
requires-python = ">=3.12"
dependencies = ["usd-core==25.11", "jsonschema==4.25.1"]

[project.urls]
Homepage = "https://github.com/pr9868/scene-acceptance"
Repository = "https://github.com/pr9868/scene-acceptance"
Issues = "https://github.com/pr9868/scene-acceptance/issues"

[project.optional-dependencies]
test = ["pytest==8.4.2"]
nvidia = ["usd-validation-nvidia==1.20.0"]

[project.scripts]
check-3d = "scene_acceptance.cli:main"
check-3d-packs = "scene_acceptance.catalog_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scene_acceptance = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
