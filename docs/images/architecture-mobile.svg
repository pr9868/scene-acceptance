<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1045" role="img"><title>3D acceptance architecture and ownership</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#5b6862"/></marker></defs><rect width="380" height="1045" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="22" y="34" fill="#21302b" font-size="22" font-weight="600">3D acceptance architecture</text><rect x="22" y="50" width="12" height="12" fill="#32658a"/><text x="41" y="62" fill="#21302b" font-size="16" font-weight="normal">Human</text><rect x="180" y="50" width="12" height="12" fill="#73568c"/><text x="199" y="62" fill="#21302b" font-size="16" font-weight="normal">Agent</text><rect x="22" y="76" width="12" height="12" fill="#5b6862"/><text x="41" y="88" fill="#21302b" font-size="16" font-weight="normal">Application</text><rect x="180" y="76" width="12" height="12" fill="#357257"/><text x="199" y="88" fill="#21302b" font-size="16" font-weight="normal">Evaluator</text><rect x="22" y="110" width="336" height="100" rx="9" fill="#eff5f9" stroke="#32658a" stroke-width="1.5"/><text x="38" y="138" fill="#32658a" font-size="19" font-weight="600">Owner approves</text><text x="38" y="164" fill="#21302b" font-size="16" font-weight="normal">Brief, use, requirements,</text><text x="38" y="189" fill="#21302b" font-size="16" font-weight="normal">evidence and tolerances</text><path d="M190 212 L190 237" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="22" y="242" width="336" height="100" rx="9" fill="#f3eef7" stroke="#73568c" stroke-width="1.5"/><text x="38" y="270" fill="#73568c" font-size="19" font-weight="600">Producer agent</text><text x="38" y="296" fill="#21302b" font-size="16" font-weight="normal">Chooses tools; creates content.</text><text x="38" y="321" fill="#21302b" font-size="16" font-weight="normal">Submits a saved USD bundle.</text><path d="M190 344 L190 369" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="22" y="374" width="336" height="100" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.5"/><text x="38" y="402" fill="#5b6862" font-size="19" font-weight="600">Application calls evaluation</text><text x="38" y="428" fill="#21302b" font-size="16" font-weight="normal">Supplies approved contract.</text><text x="38" y="453" fill="#21302b" font-size="16" font-weight="normal">Controls permissions and attempts.</text><path d="M190 476 L190 501" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="22" y="506" width="336" height="295" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.5"/><text x="38" y="534" fill="#357257" font-size="19" font-weight="600">Implemented harness core</text><text x="38" y="560" fill="#21302b" font-size="16" font-weight="normal">Validate inputs and run checks.</text><text x="38" y="585" fill="#21302b" font-size="16" font-weight="normal">Geometry + native OpenUSD</text><text x="38" y="610" fill="#21302b" font-size="16" font-weight="normal">Material delivery + sampled motion</text><text x="38" y="635" fill="#21302b" font-size="16" font-weight="normal">Selected NVIDIA rules</text><text x="38" y="660" fill="#21302b" font-size="16" font-weight="normal">Approved external packs</text><text x="38" y="685" fill="#21302b" font-size="16" font-weight="normal">Retain observations and identity.</text><text x="38" y="710" fill="#21302b" font-size="16" font-weight="normal">Return decision and missing evidence.</text><path d="M190 803 L190 828" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="22" y="833" width="336" height="126" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.5"/><text x="38" y="861" fill="#5b6862" font-size="19" font-weight="600">Application handles result</text><text x="38" y="887" fill="#21302b" font-size="16" font-weight="normal">Release accepted revision,</text><text x="38" y="912" fill="#21302b" font-size="16" font-weight="normal">return findings, or resolve gaps.</text><text x="38" y="937" fill="#21302b" font-size="16" font-weight="normal">The producer makes any edits.</text><path d="M22 900 H8 V293 H20" fill="none" stroke="#73568c" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="22" y="993" fill="#5b6862" font-size="16" font-weight="normal">Dashed feedback: proposed integration.</text><text x="22" y="1018" fill="#5b6862" font-size="16" font-weight="normal">No automatic repair loop demonstrated.</text></g></svg>