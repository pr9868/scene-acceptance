<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1190" viewBox="0 0 400 1190" role="img" aria-labelledby="title desc">
<title id="title">A brief, reusable checks and a delivery decision</title>
<desc id="desc">The owner supplies the brief and reviews requirements. The application supplies the saved scene and evidence. The harness runs selected reusable evaluation packs and optional model review. Its report retains results, gaps and next actions. The application applies the owner’s release policy or routes further work.</desc>
<rect width="400" height="1190" rx="12" fill="#101722"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#9caec1"/></marker></defs>
<text x="22" y="34" fill="#f1f5f9" font-size="24" font-weight="600" font-family="Arial, sans-serif">From brief to decision</text>
<rect x="20" y="60" width="360" height="164" rx="8" fill="#1b2535" stroke="#607286"/>
<text x="36" y="88" fill="#afcdef" font-size="18" font-weight="600" font-family="Arial, sans-serif">OWNER · define the job</text>
<text x="36" y="121" fill="#d3dce6" font-size="18" font-weight="400" font-family="Arial, sans-serif">Brief: purpose and references</text>
<text x="36" y="149" fill="#d3dce6" font-size="18" font-weight="400" font-family="Arial, sans-serif">Review requirements and tolerances</text>
<text x="36" y="177" fill="#d3dce6" font-size="18" font-weight="400" font-family="Arial, sans-serif">Choose required vs advisory policy</text>
<rect x="20" y="245" width="360" height="153" rx="8" fill="#1b2535" stroke="#607286"/>
<text x="36" y="273" fill="#afcdef" font-size="18" font-weight="600" font-family="Arial, sans-serif">CALLER · supply the delivery</text>
<text x="36" y="306" fill="#d3dce6" font-size="18" font-weight="400" font-family="Arial, sans-serif">Saved USD scene and dependencies</text>
<text x="36" y="334" fill="#d3dce6" font-size="18" font-weight="400" font-family="Arial, sans-serif">Requested views or measurements</text>
<text x="36" y="362" fill="#d3dce6" font-size="18" font-weight="400" font-family="Arial, sans-serif">Evidence for the delivered revision</text>
<path d="M200 224 V238" fill="none" stroke="#9caec1" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M200 398 V427" fill="none" stroke="#9caec1" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="434" width="360" height="383" rx="8" fill="#172b31" stroke="#74a399"/>
<text x="36" y="463" fill="#a5e0cd" font-size="19" font-weight="600" font-family="Arial, sans-serif">HARNESS · evaluate scope</text>
<rect x="34" y="480" width="332" height="133" rx="8" fill="#203a3e" stroke="#74a399"/>
<text x="46" y="507" fill="#a5e0cd" font-size="16" font-weight="600" font-family="Arial, sans-serif">SELECTED REUSABLE PACKS</text>
<text x="46" y="537" fill="#d3dce6" font-size="17" font-weight="400" font-family="Arial, sans-serif">Check code + coverage limits</text>
<text x="46" y="565" fill="#d3dce6" font-size="17" font-weight="400" font-family="Arial, sans-serif">Each job supplies subjects,</text>
<text x="46" y="593" fill="#d3dce6" font-size="17" font-weight="400" font-family="Arial, sans-serif">targets and required/advisory policy</text>
<rect x="34" y="629" width="332" height="113" rx="8" fill="#292b42" stroke="#a6a0c6"/>
<text x="46" y="656" fill="#d3c7f3" font-size="16" font-weight="600" font-family="Arial, sans-serif">OPTIONAL MODEL REVIEW</text>
<text x="46" y="686" fill="#d3dce6" font-size="17" font-weight="400" font-family="Arial, sans-serif">Questions + suitable views</text>
<text x="46" y="714" fill="#d3dce6" font-size="17" font-weight="400" font-family="Arial, sans-serif">Separate advisory opinions</text>
<text x="36" y="775" fill="#d3dce6" font-size="17" font-weight="400" font-family="Arial, sans-serif">New target? Configure the check.</text>
<text x="36" y="800" fill="#d3dce6" font-size="17" font-weight="400" font-family="Arial, sans-serif">New measurement? Add a tested pack.</text>
<path d="M200 817 V846" fill="none" stroke="#9caec1" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="853" width="360" height="127" rx="8" fill="#1b2535" stroke="#607286"/>
<text x="36" y="883" fill="#f1f5f9" font-size="19" font-weight="600" font-family="Arial, sans-serif">REPORT · inspectable evidence</text>
<text x="36" y="917" fill="#d3dce6" font-size="18" font-weight="400" font-family="Arial, sans-serif">Measured results and review opinions</text>
<text x="36" y="945" fill="#d3dce6" font-size="18" font-weight="400" font-family="Arial, sans-serif">Coverage gaps and next actions</text>
<path d="M200 980 V1009" fill="none" stroke="#9caec1" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="20" y="1016" width="360" height="153" rx="8" fill="#1b2535" stroke="#607286"/>
<text x="36" y="1045" fill="#afcdef" font-size="18" font-weight="600" font-family="Arial, sans-serif">CALLER · apply owner’s policy</text>
<text x="36" y="1080" fill="#d3dce6" font-size="18" font-weight="400" font-family="Arial, sans-serif">Accept within the checked scope,</text>
<text x="36" y="1108" fill="#d3dce6" font-size="18" font-weight="400" font-family="Arial, sans-serif">request repair, supply evidence</text>
<text x="36" y="1136" fill="#d3dce6" font-size="18" font-weight="400" font-family="Arial, sans-serif">or resolve the scope.</text>
</svg>
