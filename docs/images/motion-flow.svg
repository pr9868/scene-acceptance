<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" role="img"><title>From a saved animation to a motion finding</title><desc>The saved USD and approved sample contract feed OpenUSD world-transform evaluation and the motion pack comparison. The retained example has expected x 0.5 metres and observed x 0.8 metres at time code 1, which fails the required sample. Coverage is named world origins at selected times; orientation and occupied geometry are outside the check.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#5b6862"/></marker></defs><rect width="900" height="800" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="38" font-size="26" fill="#21302b" font-weight="600">From a saved animation to a motion finding</text><text x="25" y="69" font-size="18" fill="#5b6862" font-weight="normal">Implemented sampled-position check · example from the saved midpoint case</text><rect x="25" y="103" width="405" height="105" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.4"/><text x="41" y="132" font-size="20" fill="#5b6862" font-weight="600">Saved USD animation</text><text x="41" y="160" font-size="18" fill="#21302b" font-weight="normal">Object: /World/Panel</text><text x="41" y="185" font-size="18" fill="#21302b" font-weight="normal">Transforms, hierarchy and stage units.</text><rect x="470" y="103" width="405" height="105" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.4"/><text x="486" y="132" font-size="20" fill="#5b6862" font-weight="600">Approved sample contract</text><text x="486" y="160" font-size="18" fill="#21302b" font-weight="normal">Times + expected world origins.</text><text x="486" y="185" font-size="18" fill="#21302b" font-weight="normal">Tolerance + required check status.</text><path d="M230 210 L230 238" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M670 210 L670 238" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="25" y="244" width="405" height="131" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.4"/><text x="41" y="273" font-size="20" fill="#5b6862" font-weight="600">OpenUSD</text><text x="41" y="301" font-size="18" fill="#21302b" font-weight="normal">Usd.TimeCode → UsdGeom.XformCache</text><text x="41" y="326" font-size="18" fill="#21302b" font-weight="normal">Evaluate the composed world transform.</text><text x="41" y="351" font-size="18" fill="#21302b" font-weight="normal">Read authored stage-unit metadata.</text><rect x="470" y="244" width="405" height="131" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.4"/><text x="486" y="273" font-size="20" fill="#357257" font-weight="600">Motion pack reads requirement</text><text x="486" y="301" font-size="18" fill="#21302b" font-weight="normal">Example: time code 1.</text><text x="486" y="326" font-size="18" fill="#21302b" font-weight="normal">Expected origin: [0.5, 0, 0] m.</text><text x="486" y="351" font-size="18" fill="#21302b" font-weight="normal">Configured tolerance: 0.000001 m.</text><path d="M230 377 V405 H450 V431" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M670 377 V405 H450" fill="none" stroke="#5b6862" stroke-width="1.6"/><rect x="125" y="437" width="650" height="126" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.4"/><text x="141" y="466" font-size="20" fill="#357257" font-weight="600">Compare each coordinate</text><text x="141" y="494" font-size="18" fill="#21302b" font-weight="normal">Origin converted to metres: [0.8, 0, 0].</text><text x="141" y="519" font-size="18" fill="#21302b" font-weight="normal">X differs by 0.300 m, exceeding the configured tolerance.</text><text x="141" y="544" font-size="18" fill="#21302b" font-weight="normal">The required sample fails.</text><path d="M450 565 L450 593" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="125" y="599" width="650" height="101" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.4"/><text x="141" y="628" font-size="20" fill="#357257" font-weight="600">Harness report: REJECT</text><text x="141" y="656" font-size="18" fill="#21302b" font-weight="normal">Retain object, time, expected and observed values.</text><text x="141" y="681" font-size="18" fill="#21302b" font-weight="normal">Caller can route the finding to the producer.</text><text x="25" y="744" font-size="17" fill="#5b6862" font-weight="normal">Coverage: named origins at selected times. Orientation and swept geometry are untested.</text><text x="25" y="775" font-size="17" fill="#5b6862" font-weight="normal">Gray: input or library. Green: project comparison and report.</text></g></svg>