<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1060" role="img"><title>Inside the implemented 3D acceptance harness</title><desc>Caller inputs flow through contract planning, saved USD admission, sequential selected pack evaluation and required-result reduction. Per-check integrity guards remain inside the evaluation loop. The report returns to application code, which owns any release or producer retry.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#5b6862"/></marker></defs><rect width="840" height="1060" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="36" fill="#21302b" font-size="25" font-weight="600">Inside one harness evaluation</text><text x="25" y="65" fill="#5b6862" font-size="17" font-weight="normal">Contract v2 · implemented v0.3 · sequential execution</text><rect x="25" y="90" width="790" height="92" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.5"/><text x="41" y="119" fill="#5b6862" font-size="20" font-weight="600">Calling application supplies</text><text x="41" y="147" fill="#21302b" font-size="17" font-weight="normal">Approved contract + saved USD bundle; approved extension IDs.</text><text x="41" y="172" fill="#21302b" font-size="17" font-weight="normal">Optional baseline and declared reference evidence.</text><path d="M420 184 L420 213" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="25" y="219" width="790" height="92" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.5"/><text x="41" y="248" fill="#357257" font-size="20" font-weight="600">1  Plan the requirements</text><text x="41" y="276" fill="#21302b" font-size="17" font-weight="normal">Validate contract schema; order checks by declared prerequisites.</text><text x="41" y="301" fill="#21302b" font-size="17" font-weight="normal">Resolve the registry of bundled and approved installed packs.</text><path d="M420 313 L420 342" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="25" y="348" width="790" height="92" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.5"/><text x="41" y="377" fill="#357257" font-size="20" font-weight="600">2  Admit and identify the saved inputs</text><text x="41" y="405" fill="#21302b" font-size="17" font-weight="normal">Inspect supported USD layers and declared local dependencies.</text><text x="41" y="430" fill="#21302b" font-size="17" font-weight="normal">Read candidate / baseline; retain file hashes and missing evidence.</text><path d="M273 442 L273 471" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="25" y="477" width="497" height="220" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.5"/><text x="41" y="506" fill="#357257" font-size="20" font-weight="600">3  Execute each selected check</text><text x="41" y="534" fill="#21302b" font-size="17" font-weight="normal">Check pack version, parameters and prerequisites.</text><text x="41" y="559" fill="#21302b" font-size="17" font-weight="normal">Call the evaluator; record its outcome and timing.</text><text x="41" y="584" fill="#21302b" font-size="17" font-weight="normal">Check for changed inputs, USD layers or pack code.</text><text x="41" y="609" fill="#21302b" font-size="17" font-weight="normal">Then continue to the next planned check.</text><text x="41" y="634" fill="#21302b" font-size="17" font-weight="normal">Blocked prerequisite → UNKNOWN.</text><text x="41" y="659" fill="#21302b" font-size="17" font-weight="normal">Independent checks can continue after a failure.</text><rect x="550" y="477" width="265" height="220" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.5"/><text x="566" y="506" fill="#357257" font-size="20" font-weight="600">Selected providers</text><text x="566" y="534" fill="#21302b" font-size="17" font-weight="normal">Geometry / edit rules</text><text x="566" y="559" fill="#21302b" font-size="17" font-weight="normal">Material bindings / files</text><text x="566" y="584" fill="#21302b" font-size="17" font-weight="normal">Sampled motion</text><text x="566" y="609" fill="#21302b" font-size="17" font-weight="normal">Native OpenUSD rules</text><text x="566" y="634" fill="#21302b" font-size="17" font-weight="normal">NVIDIA rules (optional)</text><text x="566" y="659" fill="#21302b" font-size="17" font-weight="normal">Approved custom packs</text><path d="M524 554 L548 554" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M548 611 L524 611" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M273 699 L273 728" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="25" y="734" width="790" height="117" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.5"/><text x="41" y="763" fill="#357257" font-size="20" font-weight="600">4  Assemble the decision and evidence</text><text x="41" y="791" fill="#21302b" font-size="17" font-weight="normal">Combine required results; retain advisory findings and coverage.</text><text x="41" y="816" fill="#21302b" font-size="17" font-weight="normal">A required failure rejects; unresolved checks cannot become passes.</text><text x="41" y="841" fill="#21302b" font-size="17" font-weight="normal">Input or integrity errors invalidate the evaluation.</text><path d="M420 853 L420 882" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="25" y="888" width="790" height="92" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.5"/><text x="41" y="917" fill="#5b6862" font-size="20" font-weight="600">Report returns to the calling application</text><text x="41" y="945" fill="#21302b" font-size="17" font-weight="normal">Decision + findings + input and evaluator identities.</text><text x="41" y="970" fill="#21302b" font-size="17" font-weight="normal">CLI also writes JSON, HTML and report-file hashes.</text><text x="25" y="1013" fill="#5b6862" font-size="16" font-weight="normal">Green: harness and evaluators. Gray: calling application and report handoff.</text><text x="25" y="1038" fill="#5b6862" font-size="16" font-weight="normal">Producer retries and artifact release remain in the application.</text></g></svg>