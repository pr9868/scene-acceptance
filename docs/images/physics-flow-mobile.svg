<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1458" role="img"><title>Configuration, task behavior and physical evidence</title><desc>The installed NVIDIA configuration pack and separate CPU experiment inspect the saved two-box USD scenes. OpenUSD and a restricted adapter write a MuJoCo model. NumPy computes maximum along-slope displacement from simulator states. The recorded low and high friction cases differ in task outcome, while both friction coefficients remain assumed and physical correspondence remains unresolved.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#5b6862"/></marker></defs><rect width="380" height="1458" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="22" y="35" font-size="24" fill="#21302b" font-weight="600">Three kinds of evidence</text><text x="22" y="64" font-size="17" fill="#5b6862" font-weight="normal">Recorded incline experiment</text><rect x="22" y="94" width="336" height="133" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.4"/><text x="38" y="123" font-size="20" fill="#5b6862" font-weight="600">Scene + declared task</text><text x="38" y="151" font-size="16" fill="#21302b" font-weight="normal">Two boxes; friction 0.15 or 0.65.</text><text x="38" y="176" font-size="16" fill="#21302b" font-weight="normal">Maximum drift ≤ 10 mm in 1 s.</text><text x="38" y="201" font-size="16" fill="#21302b" font-weight="normal">The coefficients are assumptions.</text><path d="M190 229 L190 257" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="22" y="263" width="336" height="250" rx="11" fill="none" stroke="#357257" stroke-width="1.5"/><text x="39" y="294" font-size="20" fill="#357257" font-weight="600">Installed configuration pack</text><rect x="38" y="314" width="304" height="131" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.4"/><text x="54" y="343" font-size="20" fill="#5b6862" font-weight="600">NVIDIA rules</text><text x="54" y="371" font-size="16" fill="#21302b" font-weight="normal">MassChecker; RigidBodyChecker;</text><text x="54" y="396" font-size="16" fill="#21302b" font-weight="normal">ColliderChecker.</text><text x="54" y="421" font-size="16" fill="#21302b" font-weight="normal">Both friction cases pass.</text><text x="40" y="482" font-size="18" fill="#a44835" font-weight="600">Negative mass: REJECT</text><rect x="22" y="549" width="336" height="630" rx="11" fill="none" stroke="#5b6862" stroke-width="1.5" stroke-dasharray="7 5"/><text x="39" y="580" font-size="20" fill="#5b6862" font-weight="600">Separate CPU experiment</text><rect x="38" y="601" width="304" height="107" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.4"/><text x="54" y="630" font-size="20" fill="#5b6862" font-weight="600">OpenUSD + adapter</text><text x="54" y="658" font-size="16" fill="#21302b" font-weight="normal">Read supported two-box scene.</text><text x="54" y="683" font-size="16" fill="#21302b" font-weight="normal">Write explicit MuJoCo model.</text><path d="M190 710 L190 735" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="38" y="741" width="304" height="107" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.4"/><text x="54" y="770" font-size="20" fill="#5b6862" font-weight="600">MuJoCo</text><text x="54" y="798" font-size="16" fill="#21302b" font-weight="normal">Simulate the positive-mass cases.</text><text x="54" y="823" font-size="16" fill="#21302b" font-weight="normal">Record poses and contacts.</text><path d="M190 850 L190 875" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="38" y="881" width="304" height="107" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.4"/><text x="54" y="910" font-size="20" fill="#357257" font-weight="600">Task comparison</text><text x="54" y="938" font-size="16" fill="#21302b" font-weight="normal">NumPy: maximum along-slope drift.</text><text x="54" y="963" font-size="16" fill="#21302b" font-weight="normal">Compare the full trace with 10 mm.</text><path d="M190 990 L190 1015" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="38" y="1021" width="304" height="133" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.4"/><text x="54" y="1050" font-size="20" fill="#357257" font-weight="600">Recorded at 1 ms</text><text x="54" y="1078" font-size="16" fill="#21302b" font-weight="normal">μ 0.15: 987.23 mm → FAIL</text><text x="54" y="1103" font-size="16" fill="#21302b" font-weight="normal">μ 0.65: 1.06 mm → PASS</text><text x="54" y="1128" font-size="16" fill="#21302b" font-weight="normal">One simulated second.</text><rect x="22" y="1215" width="336" height="133" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.4"/><text x="38" y="1244" font-size="20" fill="#5b6862" font-weight="600">Real-contact evidence</text><text x="38" y="1272" font-size="16" fill="#21302b" font-weight="normal">Friction remains assumed.</text><text x="38" y="1297" font-size="16" fill="#21302b" font-weight="normal">Physical correspondence unresolved.</text><text x="38" y="1322" font-size="16" fill="#21302b" font-weight="normal">Simulation does not measure friction.</text><text x="22" y="1382" font-size="16" fill="#5b6862" font-weight="normal">Gray: input or library.</text><text x="22" y="1407" font-size="16" fill="#5b6862" font-weight="normal">Green: project evaluation.</text><text x="22" y="1432" font-size="16" fill="#5b6862" font-weight="normal">Dashed: separate executed experiment.</text></g></svg>