<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 695" role="img"><title>Material delivery evidence and its decoding boundary</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#5b6862"/></marker></defs><rect width="380" height="695" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="22" y="34" fill="#21302b" font-size="20" font-weight="600">Material checks and their limits</text><rect x="22" y="60" width="336" height="170" rx="9" fill="#ffffff" stroke="#a44835" stroke-width="1.5"/><text x="38" y="88" fill="#a44835" font-size="19" font-weight="600">Wrong binding</text><text x="38" y="114" fill="#21302b" font-size="16" font-weight="normal">Required: Coating</text><text x="38" y="139" fill="#21302b" font-size="16" font-weight="normal">Resolved: Other</text><text x="38" y="164" fill="#21302b" font-size="16" font-weight="normal">Material requirement: FAIL</text><rect x="22" y="253" width="336" height="170" rx="9" fill="#ffffff" stroke="#a44835" stroke-width="1.5"/><text x="38" y="281" fill="#a44835" font-size="19" font-weight="600">Missing texture</text><text x="38" y="307" fill="#21302b" font-size="16" font-weight="normal">Referenced: pixel.png</text><text x="38" y="332" fill="#21302b" font-size="16" font-weight="normal">File absent</text><text x="38" y="357" fill="#21302b" font-size="16" font-weight="normal">Corrected delivery check: FAIL</text><rect x="22" y="446" width="336" height="170" rx="9" fill="#ffffff" stroke="#73568c" stroke-width="1.5"/><text x="38" y="474" fill="#73568c" font-size="19" font-weight="600">Unreadable texture</text><text x="38" y="500" fill="#21302b" font-size="16" font-weight="normal">pixel.png contains plain text</text><text x="38" y="525" fill="#21302b" font-size="16" font-weight="normal">Delivery check: PASS</text><text x="38" y="550" fill="#21302b" font-size="16" font-weight="normal">Separate image decode: FAIL</text><text x="22" y="663" fill="#5b6862" font-size="16" font-weight="normal">No rendering or appearance comparison.</text></g></svg>