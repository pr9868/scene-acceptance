<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1348" role="img"><title>Inside the implemented 3D acceptance harness</title><desc>Caller inputs flow through contract planning, saved USD admission, sequential selected pack evaluation and required-result reduction. Per-check integrity guards remain inside the evaluation loop. The report returns to application code, which owns any release or producer retry.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#5b6862"/></marker></defs><rect width="380" height="1348" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="22" y="33" fill="#21302b" font-size="23" font-weight="600">Inside one evaluation</text><text x="22" y="60" fill="#5b6862" font-size="16" font-weight="normal">Contract v2 · implemented v0.3</text><rect x="22" y="85" width="336" height="126" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.5"/><text x="38" y="114" fill="#5b6862" font-size="20" font-weight="600">Application supplies</text><text x="38" y="142" fill="#21302b" font-size="17" font-weight="normal">Approved contract + USD bundle.</text><text x="38" y="167" fill="#21302b" font-size="17" font-weight="normal">Baseline / evidence when needed.</text><text x="38" y="192" fill="#21302b" font-size="17" font-weight="normal">Allowed extension pack IDs.</text><path d="M190 213 L190 237" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="22" y="243" width="336" height="126" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.5"/><text x="38" y="272" fill="#357257" font-size="20" font-weight="600">1  Plan requirements</text><text x="38" y="300" fill="#21302b" font-size="17" font-weight="normal">Validate the contract schema.</text><text x="38" y="325" fill="#21302b" font-size="17" font-weight="normal">Order checks by prerequisites.</text><text x="38" y="350" fill="#21302b" font-size="17" font-weight="normal">Resolve approved pack registry.</text><path d="M190 371 L190 395" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="22" y="401" width="336" height="126" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.5"/><text x="38" y="430" fill="#357257" font-size="20" font-weight="600">2  Admit saved inputs</text><text x="38" y="458" fill="#21302b" font-size="17" font-weight="normal">Read supported USD and files.</text><text x="38" y="483" fill="#21302b" font-size="17" font-weight="normal">Record candidate / baseline hashes.</text><text x="38" y="508" fill="#21302b" font-size="17" font-weight="normal">Keep missing evidence visible.</text><path d="M190 529 L190 553" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="22" y="559" width="336" height="201" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.5"/><text x="38" y="588" fill="#357257" font-size="20" font-weight="600">3  Run checks sequentially</text><text x="38" y="616" fill="#21302b" font-size="17" font-weight="normal">Verify version and parameters.</text><text x="38" y="641" fill="#21302b" font-size="17" font-weight="normal">Check prerequisites; run evaluator.</text><text x="38" y="666" fill="#21302b" font-size="17" font-weight="normal">Record findings and timing.</text><text x="38" y="691" fill="#21302b" font-size="17" font-weight="normal">Check input / layer / code integrity.</text><text x="38" y="716" fill="#21302b" font-size="17" font-weight="normal">Repeat for the next selected check.</text><text x="38" y="741" fill="#21302b" font-size="17" font-weight="normal">Blocked prerequisite → UNKNOWN.</text><rect x="22" y="777" width="336" height="151" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.5"/><text x="38" y="806" fill="#357257" font-size="20" font-weight="600">Providers selected by contract</text><text x="38" y="834" fill="#21302b" font-size="17" font-weight="normal">Geometry; materials; motion.</text><text x="38" y="859" fill="#21302b" font-size="17" font-weight="normal">Native OpenUSD validators.</text><text x="38" y="884" fill="#21302b" font-size="17" font-weight="normal">Optional NVIDIA validation rules.</text><text x="38" y="909" fill="#21302b" font-size="17" font-weight="normal">Approved installed custom packs.</text><path d="M190 930 L190 954" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="22" y="960" width="336" height="151" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.5"/><text x="38" y="989" fill="#357257" font-size="20" font-weight="600">4  Assemble the result</text><text x="38" y="1017" fill="#21302b" font-size="17" font-weight="normal">Combine required outcomes.</text><text x="38" y="1042" fill="#21302b" font-size="17" font-weight="normal">Retain advisory findings and gaps.</text><text x="38" y="1067" fill="#21302b" font-size="17" font-weight="normal">Reject required failures.</text><text x="38" y="1092" fill="#21302b" font-size="17" font-weight="normal">Input / integrity errors invalidate.</text><path d="M190 1113 L190 1137" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="22" y="1143" width="336" height="126" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.5"/><text x="38" y="1172" fill="#5b6862" font-size="20" font-weight="600">Application receives report</text><text x="38" y="1200" fill="#21302b" font-size="17" font-weight="normal">Decision, findings and identities.</text><text x="38" y="1225" fill="#21302b" font-size="17" font-weight="normal">CLI: JSON + HTML + file hashes.</text><text x="38" y="1250" fill="#21302b" font-size="17" font-weight="normal">Caller owns retries and release.</text><text x="22" y="1301" fill="#5b6862" font-size="16" font-weight="normal">Green: harness and evaluators.</text><text x="22" y="1326" fill="#5b6862" font-size="16" font-weight="normal">Gray: application and report handoff.</text></g></svg>