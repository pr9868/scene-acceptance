<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1022" role="img"><title>From a saved animation to a motion finding</title><desc>The saved USD and approved sample contract feed OpenUSD world-transform evaluation and the motion pack comparison. The retained example has expected x 0.5 metres and observed x 0.8 metres at time code 1, which fails the required sample. Coverage is named world origins at selected times; orientation and occupied geometry are outside the check.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#5b6862"/></marker></defs><rect width="380" height="1022" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="22" y="35" font-size="23" fill="#21302b" font-weight="600">From animation to finding</text><text x="22" y="64" font-size="17" fill="#5b6862" font-weight="normal">Implemented position comparison</text><rect x="22" y="95" width="336" height="133" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.4"/><text x="38" y="124" font-size="20" fill="#5b6862" font-weight="600">Scene + sample contract</text><text x="38" y="152" font-size="16" fill="#21302b" font-weight="normal">Named object; hierarchy and units.</text><text x="38" y="177" font-size="16" fill="#21302b" font-weight="normal">Times, expected origins, tolerance.</text><text x="38" y="202" font-size="16" fill="#21302b" font-weight="normal">Example: /World/Panel at t = 1.</text><path d="M190 230 L190 258" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="22" y="264" width="336" height="133" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.4"/><text x="38" y="293" font-size="20" fill="#5b6862" font-weight="600">OpenUSD</text><text x="38" y="321" font-size="17" fill="#21302b" font-weight="normal">Usd.TimeCode + XformCache</text><text x="38" y="346" font-size="17" fill="#21302b" font-weight="normal">Evaluate the world transform.</text><text x="38" y="371" font-size="17" fill="#21302b" font-weight="normal">Origin read back: [0.8, 0, 0] m.</text><path d="M190 399 L190 427" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="22" y="433" width="336" height="158" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.4"/><text x="38" y="462" font-size="20" fill="#357257" font-weight="600">Motion pack compares</text><text x="38" y="490" font-size="17" fill="#21302b" font-weight="normal">Expected: [0.5, 0, 0] m.</text><text x="38" y="515" font-size="17" fill="#21302b" font-weight="normal">X error: 0.300 m.</text><text x="38" y="540" font-size="17" fill="#21302b" font-weight="normal">Tolerance: 0.000001 m.</text><text x="38" y="565" font-size="17" fill="#21302b" font-weight="normal">Required sample: FAIL.</text><path d="M190 593 L190 621" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="22" y="627" width="336" height="133" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.4"/><text x="38" y="656" font-size="20" fill="#357257" font-weight="600">Harness report: REJECT</text><text x="38" y="684" font-size="17" fill="#21302b" font-weight="normal">Object and time.</text><text x="38" y="709" font-size="17" fill="#21302b" font-weight="normal">Expected and observed values.</text><text x="38" y="734" font-size="17" fill="#21302b" font-weight="normal">No edit to the submitted motion.</text><rect x="22" y="800" width="336" height="133" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.4"/><text x="38" y="829" font-size="20" fill="#5b6862" font-weight="600">Coverage of this check</text><text x="38" y="857" font-size="17" fill="#21302b" font-weight="normal">Named origins at selected times.</text><text x="38" y="882" font-size="17" fill="#21302b" font-weight="normal">No orientation or swept geometry.</text><text x="38" y="907" font-size="17" fill="#21302b" font-weight="normal">No unsampled-interval guarantee.</text><text x="22" y="970" font-size="16" fill="#5b6862" font-weight="normal">Gray: input or library.</text><text x="22" y="996" font-size="16" fill="#5b6862" font-weight="normal">Green: project evaluation.</text></g></svg>