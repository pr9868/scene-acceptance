<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 865" role="img"><title>How a material delivery is evaluated</title><desc>The installed material pack uses OpenUSD and compares bindings, shader IDs and file presence with the contract. A separate Pillow probe reads the texture bytes. In the retained unreadable-texture case, delivery accepts while decoding fails. The decode result is not part of that acceptance verdict.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#5b6862"/></marker></defs><rect width="900" height="865" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="38" font-size="27" fill="#21302b" font-weight="600">How a material delivery is evaluated</text><text x="25" y="69" font-size="19" fill="#5b6862" font-weight="normal">Two measurements of the same saved bundle</text><rect x="25" y="96" width="850" height="88" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.4"/><text x="41" y="125" font-size="20" fill="#5b6862" font-weight="600">Input: USD bundle + material contract</text><text x="41" y="153" font-size="18" fill="#21302b" font-weight="normal">Recorded probe: correct binding and shader; pixel.png contains plain text.</text><path d="M450 186 V207 H230 V229" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M450 207 H670 V229" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="25" y="236" width="410" height="410" rx="11" fill="none" stroke="#357257" stroke-width="1.5"/><text x="42" y="267" font-size="20" fill="#357257" font-weight="600">Installed material pack</text><rect x="465" y="236" width="410" height="410" rx="11" fill="none" stroke="#5b6862" stroke-width="1.5" stroke-dasharray="7 5"/><text x="482" y="267" font-size="20" fill="#5b6862" font-weight="600">Separate companion probe</text><rect x="43" y="290" width="374" height="113" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.4"/><text x="59" y="319" font-size="20" fill="#5b6862" font-weight="600">OpenUSD</text><text x="59" y="347" font-size="18" fill="#21302b" font-weight="normal">Resolve binding and surface source.</text><text x="59" y="372" font-size="18" fill="#21302b" font-weight="normal">Inspect referenced local files.</text><path d="M230 405 L230 433" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="43" y="439" width="374" height="113" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.4"/><text x="59" y="468" font-size="20" fill="#357257" font-weight="600">Compare with the contract</text><text x="59" y="496" font-size="18" fill="#21302b" font-weight="normal">Expected binding + shader ID.</text><text x="59" y="521" font-size="18" fill="#21302b" font-weight="normal">Check that referenced files exist.</text><path d="M230 554 L230 577" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><text x="44" y="609" font-size="21" fill="#357257" font-weight="600">Delivery: ACCEPT_FOR_USE</text><rect x="483" y="290" width="374" height="113" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.4"/><text x="499" y="319" font-size="20" fill="#5b6862" font-weight="600">Pillow</text><text x="499" y="347" font-size="18" fill="#21302b" font-weight="normal">Image.open(...).load()</text><text x="499" y="372" font-size="18" fill="#21302b" font-weight="normal">Read the delivered image bytes.</text><path d="M670 405 L670 433" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="483" y="439" width="374" height="113" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.4"/><text x="499" y="468" font-size="20" fill="#357257" font-weight="600">Record decode outcome</text><text x="499" y="496" font-size="18" fill="#21302b" font-weight="normal">png_decodes: false</text><text x="499" y="521" font-size="18" fill="#21302b" font-weight="normal">UnidentifiedImageError</text><path d="M670 554 L670 577" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><text x="484" y="609" font-size="21" fill="#a44835" font-weight="600">Decode: FAIL</text><rect x="25" y="686" width="850" height="88" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.4"/><text x="41" y="715" font-size="20" fill="#5b6862" font-weight="600">Integration still to build</text><text x="41" y="743" font-size="18" fill="#21302b" font-weight="normal">Make decoding a required check when the consuming viewer needs it.</text><text x="25" y="812" font-size="17" fill="#5b6862" font-weight="normal">Gray: saved input or library. Green: project evaluation.</text><text x="25" y="840" font-size="17" fill="#5b6862" font-weight="normal">Dashed boundary: an executed experiment outside the installed pack.</text></g></svg>