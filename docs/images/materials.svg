<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img"><title>Material delivery evidence and its decoding boundary</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#5b6862"/></marker></defs><rect width="900" height="330" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="22" y="34" fill="#21302b" font-size="25" font-weight="600">What did the material check establish?</text><rect x="22" y="70" width="280" height="170" rx="9" fill="#ffffff" stroke="#a44835" stroke-width="1.5"/><text x="38" y="98" fill="#a44835" font-size="19" font-weight="600">Wrong binding</text><text x="38" y="124" fill="#21302b" font-size="16" font-weight="normal">Required: Coating</text><text x="38" y="149" fill="#21302b" font-size="16" font-weight="normal">Resolved: Other</text><text x="38" y="174" fill="#21302b" font-size="16" font-weight="normal">Material requirement: FAIL</text><rect x="317" y="70" width="280" height="170" rx="9" fill="#ffffff" stroke="#a44835" stroke-width="1.5"/><text x="333" y="98" fill="#a44835" font-size="19" font-weight="600">Missing texture</text><text x="333" y="124" fill="#21302b" font-size="16" font-weight="normal">Referenced: pixel.png</text><text x="333" y="149" fill="#21302b" font-size="16" font-weight="normal">File absent</text><text x="333" y="174" fill="#21302b" font-size="16" font-weight="normal">Corrected delivery check: FAIL</text><rect x="612" y="70" width="280" height="170" rx="9" fill="#ffffff" stroke="#73568c" stroke-width="1.5"/><text x="628" y="98" fill="#73568c" font-size="19" font-weight="600">Unreadable texture</text><text x="628" y="124" fill="#21302b" font-size="16" font-weight="normal">pixel.png contains plain text</text><text x="628" y="149" fill="#21302b" font-size="16" font-weight="normal">Delivery check: PASS</text><text x="628" y="174" fill="#21302b" font-size="16" font-weight="normal">Separate image decode: FAIL</text><text x="22" y="298" fill="#5b6862" font-size="16" font-weight="normal">No rendering or appearance comparison.</text></g></svg>