<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 1230" role="img"><title>How a material delivery is evaluated</title><desc>The installed material pack uses OpenUSD and compares bindings, shader IDs and file presence with the contract. A separate Pillow probe reads the texture bytes. In the retained unreadable-texture case, delivery accepts while decoding fails. The decode result is not part of that acceptance verdict.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#5b6862"/></marker></defs><rect width="380" height="1230" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="22" y="35" font-size="25" fill="#21302b" font-weight="600">Material delivery</text><text x="22" y="64" font-size="17" fill="#5b6862" font-weight="normal">Two measurements, one bundle</text><rect x="22" y="90" width="336" height="116" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.4"/><text x="38" y="119" font-size="20" fill="#5b6862" font-weight="600">Input + contract</text><text x="38" y="147" font-size="17" fill="#21302b" font-weight="normal">Correct binding and shader.</text><text x="38" y="172" font-size="17" fill="#21302b" font-weight="normal">pixel.png contains plain text.</text><path d="M190 208 L190 233" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="22" y="239" width="336" height="375" rx="11" fill="none" stroke="#357257" stroke-width="1.5"/><text x="39" y="270" font-size="20" fill="#357257" font-weight="600">Installed material pack</text><rect x="38" y="291" width="304" height="107" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.4"/><text x="54" y="320" font-size="20" fill="#5b6862" font-weight="600">OpenUSD</text><text x="54" y="348" font-size="16" fill="#21302b" font-weight="normal">Resolve binding and shader.</text><text x="54" y="373" font-size="16" fill="#21302b" font-weight="normal">Inspect referenced files.</text><path d="M190 400 L190 425" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="38" y="431" width="304" height="107" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.4"/><text x="54" y="460" font-size="20" fill="#357257" font-weight="600">Compare with contract</text><text x="54" y="488" font-size="16" fill="#21302b" font-weight="normal">Binding + shader ID match.</text><text x="54" y="513" font-size="16" fill="#21302b" font-weight="normal">Referenced files exist.</text><path d="M190 540 L190 562" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><text x="40" y="592" font-size="19" fill="#357257" font-weight="600">Delivery: ACCEPT_FOR_USE</text><rect x="22" y="650" width="336" height="327" rx="11" fill="none" stroke="#5b6862" stroke-width="1.5" stroke-dasharray="7 5"/><text x="39" y="681" font-size="20" fill="#5b6862" font-weight="600">Separate companion probe</text><rect x="38" y="702" width="304" height="107" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.4"/><text x="54" y="731" font-size="20" fill="#5b6862" font-weight="600">Pillow</text><text x="54" y="759" font-size="16" fill="#21302b" font-weight="normal">Image.open(...).load()</text><text x="54" y="784" font-size="16" fill="#21302b" font-weight="normal">Read image bytes.</text><path d="M190 811 L190 836" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="38" y="842" width="304" height="88" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.4"/><text x="54" y="871" font-size="20" fill="#357257" font-weight="600">Record decode outcome</text><text x="54" y="899" font-size="16" fill="#21302b" font-weight="normal">png_decodes: false</text><text x="40" y="957" font-size="19" fill="#a44835" font-weight="600">Decode: FAIL</text><rect x="22" y="1009" width="336" height="113" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.4"/><text x="38" y="1038" font-size="20" fill="#5b6862" font-weight="600">Next integration</text><text x="38" y="1066" font-size="17" fill="#21302b" font-weight="normal">Make decoding required for</text><text x="38" y="1091" font-size="17" fill="#21302b" font-weight="normal">a viewer that needs the image.</text><text x="22" y="1154" font-size="16" fill="#5b6862" font-weight="normal">Gray: input or library.</text><text x="22" y="1179" font-size="16" fill="#5b6862" font-weight="normal">Green: project evaluation.</text><text x="22" y="1204" font-size="16" fill="#5b6862" font-weight="normal">Dashed: separate executed experiment.</text></g></svg>