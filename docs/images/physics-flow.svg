<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 866" role="img"><title>Configuration, task behavior and physical evidence</title><desc>The installed NVIDIA configuration pack and separate CPU experiment inspect the saved two-box USD scenes. OpenUSD and a restricted adapter write a MuJoCo model. NumPy computes maximum along-slope displacement from simulator states. The recorded low and high friction cases differ in task outcome, while both friction coefficients remain assumed and physical correspondence remains unresolved.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#5b6862"/></marker></defs><rect width="900" height="866" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="38" font-size="25" fill="#21302b" font-weight="600">Configuration, task behavior and physical evidence</text><text x="25" y="69" font-size="18" fill="#5b6862" font-weight="normal">Recorded two-box incline experiment · 1 ms timestep shown</text><rect x="25" y="98" width="850" height="88" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.4"/><text x="41" y="127" font-size="20" fill="#5b6862" font-weight="600">Saved scene + declared task</text><text x="41" y="155" font-size="18" fill="#21302b" font-weight="normal">Assumed friction: 0.15 or 0.65. Maximum drift ≤ 10 mm over one simulated second.</text><path d="M155 188 L155 222" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M605 188 L605 222" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="25" y="228" width="275" height="396" rx="11" fill="none" stroke="#357257" stroke-width="1.5"/><text x="42" y="259" font-size="20" fill="#357257" font-weight="600">Installed pack</text><rect x="320" y="228" width="555" height="396" rx="11" fill="none" stroke="#5b6862" stroke-width="1.5" stroke-dasharray="7 5"/><text x="337" y="259" font-size="20" fill="#5b6862" font-weight="600">Separate CPU experiment</text><rect x="42" y="284" width="241" height="132" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.4"/><text x="58" y="313" font-size="20" fill="#5b6862" font-weight="600">NVIDIA validation</text><text x="58" y="341" font-size="17" fill="#21302b" font-weight="normal">MassChecker</text><text x="58" y="366" font-size="17" fill="#21302b" font-weight="normal">RigidBodyChecker</text><text x="58" y="391" font-size="17" fill="#21302b" font-weight="normal">ColliderChecker</text><path d="M162 418 L162 447" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="42" y="453" width="241" height="106" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.4"/><text x="58" y="482" font-size="20" fill="#357257" font-weight="600">Configuration result</text><text x="58" y="510" font-size="16" fill="#21302b" font-weight="normal">Both friction cases: PASS.</text><text x="58" y="535" font-size="16" fill="#21302b" font-weight="normal">Named rules only.</text><text x="42" y="594" font-size="17" fill="#a44835" font-weight="600">Negative mass: REJECT</text><rect x="338" y="284" width="250" height="132" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.4"/><text x="354" y="313" font-size="20" fill="#5b6862" font-weight="600">OpenUSD + adapter</text><text x="354" y="341" font-size="16" fill="#21302b" font-weight="normal">Read supported two-box USD.</text><text x="354" y="366" font-size="16" fill="#21302b" font-weight="normal">Keep the contact assumptions.</text><text x="354" y="391" font-size="16" fill="#21302b" font-weight="normal">Write explicit model.xml.</text><rect x="613" y="284" width="244" height="132" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.4"/><text x="629" y="313" font-size="20" fill="#5b6862" font-weight="600">MuJoCo</text><text x="629" y="341" font-size="16" fill="#21302b" font-weight="normal">Integrate the 1 s task.</text><text x="629" y="366" font-size="16" fill="#21302b" font-weight="normal">Record poses and contacts.</text><text x="629" y="391" font-size="16" fill="#21302b" font-weight="normal">Positive-mass cases only.</text><path d="M590 350 L610 350" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M735 418 V434 H463 V451" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="338" y="457" width="250" height="134" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.4"/><text x="354" y="486" font-size="20" fill="#357257" font-weight="600">Task comparison</text><text x="354" y="514" font-size="16" fill="#21302b" font-weight="normal">NumPy: along-slope drift.</text><text x="354" y="539" font-size="16" fill="#21302b" font-weight="normal">Maximum over the full trace.</text><text x="354" y="564" font-size="16" fill="#21302b" font-weight="normal">Compare with 10 mm.</text><path d="M590 523 L610 523" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="613" y="457" width="244" height="134" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.4"/><text x="629" y="486" font-size="20" fill="#357257" font-weight="600">Recorded outcomes</text><text x="629" y="514" font-size="16" fill="#21302b" font-weight="normal">μ 0.15: 987.23 mm</text><text x="629" y="539" font-size="16" fill="#21302b" font-weight="normal">Task FAIL</text><text x="629" y="564" font-size="16" fill="#21302b" font-weight="normal">μ 0.65: 1.06 mm → PASS</text><rect x="25" y="663" width="850" height="112" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.4"/><text x="41" y="692" font-size="20" fill="#5b6862" font-weight="600">Physical correspondence remains unresolved</text><text x="41" y="720" font-size="18" fill="#21302b" font-weight="normal">Both friction coefficients are assumptions, not measurements.</text><text x="41" y="745" font-size="18" fill="#21302b" font-weight="normal">The task result is evidence about this simulated scenario.</text><text x="25" y="813" font-size="17" fill="#5b6862" font-weight="normal">Gray: input or library. Green: project evaluation.</text><text x="25" y="841" font-size="17" fill="#5b6862" font-weight="normal">Dashed boundary: executed separately; not an installed runtime pack.</text></g></svg>