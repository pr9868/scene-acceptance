<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 805" role="img"><title>3D acceptance architecture and ownership</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#5b6862"/></marker></defs><rect width="840" height="805" fill="#faf9f5"/><g font-family="Arial, sans-serif"><text x="25" y="35" fill="#21302b" font-size="24" font-weight="600">Accept the deliverable, whatever produced it</text><rect x="25" y="54" width="12" height="12" fill="#32658a"/><text x="44" y="65" fill="#21302b" font-size="15" font-weight="normal">Human</text><rect x="195" y="54" width="12" height="12" fill="#73568c"/><text x="214" y="65" fill="#21302b" font-size="15" font-weight="normal">Agent</text><rect x="350" y="54" width="12" height="12" fill="#5b6862"/><text x="369" y="65" fill="#21302b" font-size="15" font-weight="normal">Application code</text><rect x="585" y="54" width="12" height="12" fill="#357257"/><text x="604" y="65" fill="#21302b" font-size="15" font-weight="normal">Implemented evaluator</text><rect x="25" y="95" width="790" height="77" rx="9" fill="#eff5f9" stroke="#32658a" stroke-width="1.5"/><text x="41" y="123" fill="#32658a" font-size="19" font-weight="600">Owner approves the brief and acceptance contract</text><text x="41" y="149" fill="#21302b" font-size="16" font-weight="normal">Intended use • requirements • evidence • tolerances</text><path d="M180 173 L180 207" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M650 173 L650 207" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="25" y="210" width="320" height="108" rx="9" fill="#f3eef7" stroke="#73568c" stroke-width="1.5"/><text x="41" y="238" fill="#73568c" font-size="19" font-weight="600">Producer agent</text><text x="41" y="264" fill="#21302b" font-size="16" font-weight="normal">Chooses tools; creates content</text><text x="41" y="289" fill="#21302b" font-size="16" font-weight="normal">Submits a saved USD bundle</text><rect x="490" y="210" width="325" height="108" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.5"/><text x="506" y="238" fill="#5b6862" font-size="19" font-weight="600">Application calls evaluation</text><text x="506" y="264" fill="#21302b" font-size="16" font-weight="normal">Supplies the approved contract</text><text x="506" y="289" fill="#21302b" font-size="16" font-weight="normal">Controls permissions and attempts</text><path d="M350 263 L482 263" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><text x="365" y="247" fill="#21302b" font-size="15" font-weight="normal">artifact</text><path d="M650 320 L650 361" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="25" y="365" width="790" height="238" rx="9" fill="#edf5ef" stroke="#357257" stroke-width="1.5"/><text x="41" y="393" fill="#357257" font-size="19" font-weight="600">Harness core  ·  implemented v0.3</text><text x="41" y="419" fill="#21302b" font-size="16" font-weight="normal">Validate inputs → run selected checks → retain evidence</text><rect x="42" y="437" width="370" height="70" rx="9" fill="#fafcf9" stroke="#357257" stroke-width="1.5"/><text x="58" y="465" fill="#357257" font-size="19" font-weight="600">Geometry + OpenUSD</text><text x="58" y="491" fill="#21302b" font-size="16" font-weight="normal">Saved shape, edit and native rules</text><rect x="427" y="437" width="370" height="70" rx="9" fill="#fafcf9" stroke="#357257" stroke-width="1.5"/><text x="443" y="465" fill="#357257" font-size="19" font-weight="600">Materials + motion</text><text x="443" y="491" fill="#21302b" font-size="16" font-weight="normal">Bindings, files and sampled origins</text><rect x="42" y="514" width="370" height="70" rx="9" fill="#fafcf9" stroke="#357257" stroke-width="1.5"/><text x="58" y="542" fill="#357257" font-size="19" font-weight="600">NVIDIA rules</text><text x="58" y="568" fill="#21302b" font-size="16" font-weight="normal">Only the selected upstream checks</text><rect x="427" y="514" width="370" height="70" rx="9" fill="#fafcf9" stroke="#357257" stroke-width="1.5"/><text x="443" y="542" fill="#357257" font-size="19" font-weight="600">Approved extension</text><text x="443" y="568" fill="#21302b" font-size="16" font-weight="normal">Installed polygon-budget example</text><path d="M430 606 L430 644" fill="none" stroke="#5b6862" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="25" y="648" width="790" height="97" rx="9" fill="#f0f1ee" stroke="#5b6862" stroke-width="1.5"/><text x="41" y="676" fill="#5b6862" font-size="19" font-weight="600">Application applies the decision</text><text x="41" y="702" fill="#21302b" font-size="16" font-weight="normal">Release accepted revision, return findings, or resolve missing evidence.</text><text x="41" y="727" fill="#21302b" font-size="16" font-weight="normal">Content correction remains the producer’s job.</text><path d="M25 696 H10 V264 H24" fill="none" stroke="#73568c" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="25" y="780" fill="#5b6862" font-size="16" font-weight="normal">Dashed feedback route: proposed integration; no automatic repair loop demonstrated.</text></g></svg>