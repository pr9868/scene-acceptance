<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1190" viewBox="0 0 420 1190" role="img" aria-labelledby="title"><title id="title">Delegated scene production, evaluation and repair</title><rect width="100%" height="100%" fill="#f3f5f6"/><g font-family="sans-serif" fill="#182c3a"><text x="24" y="40" font-size="24" font-weight="700">From brief to reviewed delivery</text><rect x="24" y="72" width="372" height="116" rx="7" fill="white" stroke="#abbcc6"/><text x="41" y="100" font-size="14" fill="#596b77">01</text><text x="41" y="131" font-size="21" font-weight="600">Brief and delivery policy</text><text x="41" y="161" font-size="16">Purpose, requirements, evidence</text><path d="M210,193 v15 m-5,-5 l5,5 l5,-5" fill="none" stroke="#596b77" stroke-width="2"/><rect x="24" y="215" width="372" height="116" rx="7" fill="white" stroke="#abbcc6"/><text x="41" y="243" font-size="14" fill="#596b77">02</text><text x="41" y="274" font-size="21" font-weight="600">Producing agent</text><text x="41" y="304" font-size="16">Saved USD, sources and media</text><path d="M210,336 v15 m-5,-5 l5,5 l5,-5" fill="none" stroke="#596b77" stroke-width="2"/><rect x="24" y="358" width="372" height="116" rx="7" fill="white" stroke="#abbcc6"/><text x="41" y="386" font-size="14" fill="#596b77">03</text><text x="41" y="417" font-size="21" font-weight="600">Evaluation</text><text x="41" y="447" font-size="16">Selected scripts + declared review</text><path d="M210,479 v15 m-5,-5 l5,5 l5,-5" fill="none" stroke="#596b77" stroke-width="2"/><rect x="24" y="501" width="372" height="116" rx="7" fill="white" stroke="#abbcc6"/><text x="41" y="529" font-size="14" fill="#596b77">04</text><text x="41" y="560" font-size="21" font-weight="600">Actionable feedback</text><text x="41" y="590" font-size="16">Object, observation, required change</text><path d="M210,622 v15 m-5,-5 l5,5 l5,-5" fill="none" stroke="#596b77" stroke-width="2"/><rect x="24" y="644" width="372" height="116" rx="7" fill="white" stroke="#abbcc6"/><text x="41" y="672" font-size="14" fill="#596b77">05</text><text x="41" y="703" font-size="21" font-weight="600">Repair and recheck</text><text x="41" y="733" font-size="16">New revision; original scope</text><path d="M210,765 v15 m-5,-5 l5,5 l5,-5" fill="none" stroke="#596b77" stroke-width="2"/><rect x="24" y="787" width="372" height="116" rx="7" fill="white" stroke="#abbcc6"/><text x="41" y="815" font-size="14" fill="#596b77">06</text><text x="41" y="846" font-size="21" font-weight="600">Owner decision</text><text x="41" y="876" font-size="16">Fit for the intended use</text><text x="24" y="972" font-size="18" font-weight="600">Dairy</text><text x="24" y="1000" font-size="16">Producer invoked the harness during</text><text x="24" y="1023" font-size="16">building; original failed USD is absent.</text><text x="24" y="1073" font-size="18" font-weight="600">Distribution centre</text><text x="24" y="1101" font-size="16">Complete V0 archived before external</text><text x="24" y="1124" font-size="16">evaluation; exact feedback and V1 kept.</text></g></svg>