<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title"><title id="title">Delegated scene production, evaluation and repair</title><rect width="100%" height="100%" fill="#f3f5f6"/><g font-family="sans-serif" fill="#182c3a"><text x="24" y="40" font-size="24" font-weight="700">From brief to reviewed delivery</text><rect x="28" y="80" width="364" height="138" rx="7" fill="white" stroke="#abbcc6"/><text x="45" y="108" font-size="14" fill="#596b77">01</text><text x="45" y="139" font-size="21" font-weight="600">Brief and delivery policy</text><text x="45" y="169" font-size="16">Purpose, requirements, evidence</text><path d="M396,149 h18 m-5,-5 l5,5 l-5,5" fill="none" stroke="#596b77" stroke-width="2"/><rect x="418" y="80" width="364" height="138" rx="7" fill="white" stroke="#abbcc6"/><text x="435" y="108" font-size="14" fill="#596b77">02</text><text x="435" y="139" font-size="21" font-weight="600">Producing agent</text><text x="435" y="169" font-size="16">Saved USD, sources and media</text><path d="M786,149 h18 m-5,-5 l5,5 l-5,5" fill="none" stroke="#596b77" stroke-width="2"/><rect x="808" y="80" width="364" height="138" rx="7" fill="white" stroke="#abbcc6"/><text x="825" y="108" font-size="14" fill="#596b77">03</text><text x="825" y="139" font-size="21" font-weight="600">Evaluation</text><text x="825" y="169" font-size="16">Selected scripts + declared review</text><rect x="28" y="250" width="364" height="138" rx="7" fill="white" stroke="#abbcc6"/><text x="45" y="278" font-size="14" fill="#596b77">04</text><text x="45" y="309" font-size="21" font-weight="600">Actionable feedback</text><text x="45" y="339" font-size="16">Object, observation, required change</text><path d="M396,319 h18 m-5,-5 l5,5 l-5,5" fill="none" stroke="#596b77" stroke-width="2"/><rect x="418" y="250" width="364" height="138" rx="7" fill="white" stroke="#abbcc6"/><text x="435" y="278" font-size="14" fill="#596b77">05</text><text x="435" y="309" font-size="21" font-weight="600">Repair and recheck</text><text x="435" y="339" font-size="16">New revision; original scope</text><path d="M786,319 h18 m-5,-5 l5,5 l-5,5" fill="none" stroke="#596b77" stroke-width="2"/><rect x="808" y="250" width="364" height="138" rx="7" fill="white" stroke="#abbcc6"/><text x="825" y="278" font-size="14" fill="#596b77">06</text><text x="825" y="309" font-size="21" font-weight="600">Owner decision</text><text x="825" y="339" font-size="16">Fit for the intended use</text><path d="M1188,149 h6 v82 H17 v88 h8" fill="none" stroke="#596b77" stroke-width="2"/><text x="28" y="456" font-size="21" font-weight="600">Dairy</text><text x="28" y="488" font-size="18">Producer invoked the harness during building.</text><text x="28" y="515" font-size="18">The original failing USD snapshot is absent.</text><text x="620" y="456" font-size="21" font-weight="600">Distribution centre</text><text x="620" y="488" font-size="18">V0 archived before external evaluation.</text><text x="620" y="515" font-size="18">Exact feedback and the full repaired V1 are retained.</text><text x="28" y="565" font-size="16" fill="#596b77">The harness returns findings. The producer repairs. Final owner acceptance is a separate decision.</text></g></svg>