name: Verify release evidence

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies and packaged providers
        run: |
          python -m pip install -r requirements-test.lock -r requirements-articles.txt
          python -m pip install --no-deps --no-build-isolation .
          python -m pip install --no-deps --no-build-isolation ./examples/studio-mesh-pack
      - name: Verify files and reproduce observations
        run: python reproduce.py --out "$RUNNER_TEMP/scene-acceptance-replay"
      - name: Preserve replay logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-results-${{ matrix.os }}
          path: ${{ runner.temp }}/scene-acceptance-replay
          if-no-files-found: ignore
