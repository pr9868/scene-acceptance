name: Publish reviewed package to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Reviewed v-prefixed tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.release_tag }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install exact replay dependencies
        run: |
          python -m pip install -r requirements-test.lock -r requirements-articles.txt
          python -m pip install --no-deps --no-build-isolation .
          python -m pip install --no-deps --no-build-isolation ./examples/studio-mesh-pack
      - name: Verify tag matches the package and replay the distribution
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python -c 'import os,tomllib; p=tomllib.load(open("pyproject.toml","rb")); assert os.environ["RELEASE_TAG"] == "v"+p["project"]["version"]'
          python scripts/check-maintenance.py
          python -c 'import setuptools.build_meta as b; b.build_sdist("dist"); b.build_wheel("dist")'
          python scripts/verify-distributions.py dist/*.tar.gz dist/*.whl
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python reproduce.py --out "$RUNNER_TEMP/verified-replay"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distribution
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distribution
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
